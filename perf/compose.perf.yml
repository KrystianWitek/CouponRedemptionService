name: coupon-perf

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coupon_redemption_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coupon_redemption_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  wiremock:
    image: wiremock/wiremock:3.9.1
    # The default ~10 container threads cap the stub at ~500 rps with the 20 ms delay —
    # the stub would throttle the test instead of the application. The request journal
    # is disabled because it accumulates hundreds of thousands of requests in memory.
    command: ["--no-request-journal", "--container-threads", "500"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "127.0.0.1:8081:8080"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # High, localhost-only host ports so the perf stack can run next to the dev
      # compose stack (8080 app, 9090 prometheus, 3000 grafana); k6 connects inside
      # the compose network via app:8080 anyway.
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: perf
      DATABASE_URL: jdbc:postgresql://postgres:5432/coupon_redemption_service
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      GEO_IP_BASE_URL: http://wiremock:8080
      GEO_IP_CONNECT_TIMEOUT: 2s
      GEO_IP_READ_TIMEOUT: 2s
      GEO_IP_EXCLUDED_ADDRESSES: "203.0.113.99"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    healthcheck:
      # Readiness lives on the separate management port in the perf profile.
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # Perf-only monitoring stack. Same images and provisioning as the dev stack in
  # ../compose.override.yml, but its own Prometheus, Grafana and volumes: perf metrics
  # never land in the dev history and vice versa.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      # Receiver for load-test tools pushing their client-side metrics (e.g. k6 remote write).
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:19091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/coupon-redemption-service.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      # The provisioned data source points at http://prometheus:9090, which resolves to
      # the perf Prometheus inside this compose network — the dashboard is reused as-is.
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
