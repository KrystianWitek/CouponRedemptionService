# Prometheus for the performance stack (perf/compose.perf.yml). It scrapes only the
# perf application over the coupon-perf compose network — never the regular dev stack —
# so perf runs and everyday development keep separate metric histories.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: coupon-redemption-service-perf
    metrics_path: /actuator/prometheus
    static_configs:
      # The perf profile publishes the actuator on a separate management port (9090),
      # which keeps answering while the application port (8080) is saturated.
      - targets: ["app:9090"]
