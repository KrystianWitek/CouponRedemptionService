services:
  application:
    environment:
      GEO_IP_BASE_URL: http://wiremock:8080
      GEO_IP_EXCLUDED_ADDRESSES: ""
    depends_on:
      wiremock:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
