spring:
  application:
    name: CouponRedemptionService
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coupon_redemption_service}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

geo-ip:
  base-url: https://ipwho.is
  connect-timeout: 1s
  read-timeout: 2s
  excluded-addresses:
    - 127.0.0.1
    - "::1"
